<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#0b0b0c;color:#fff;font-family:Arial}

.top{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
input,button{
background:#181818;color:#fff;border:0;border-radius:10px;
padding:10px;font-size:14px
}
button{cursor:pointer}
input{width:100%;margin:10px 0}

#t{display:grid;gap:10px}

.r{
display:flex;justify-content:space-between;align-items:center;
background:#111;padding:10px;border-radius:12px;
position:relative;
}

.l{display:grid;gap:6px}
.n{font-weight:700}

.go{
width:44px;height:44px;padding:0;
display:grid;place-items:center;
}

.c{
background:#1a1a1a;
padding:4px 10px;
border-radius:999px;
width:fit-content
}

img{
width:80px;height:80px;
object-fit:cover;
border-radius:10px;
cursor:pointer
}

/* ❤️ */
.heart{
position:absolute;
bottom:8px;
right:8px;
font-size:18px;
}

/* dropdown fix */
#menu{
position:absolute;
top:48px;left:0;
width:280px;
max-height:80vh;
overflow-y:auto;
background:#121212;
border-radius:14px;
padding:12px;
display:none;
z-index:50
}

@media(max-width:600px){
#menu{
width:100%;
max-height:85vh;
}
}

/* context menu */
#ctx{
position:fixed;
background:#1a1a1a;
padding:10px;
border-radius:10px;
display:none;
z-index:999;
}
#ctx button{
display:block;
width:100%;
margin:5px 0;
}
</style>
</head>
<body>

<h1>🔥 Ranking</h1>

<div class="top">

<button onclick="menu.style.display^=1">☰</button>

<div id="menu">
<h3>Eigenes Table hinzufügen</h3>
<input id="n1" placeholder="Name">
<input id="l1" placeholder="Link">
<input id="i1" placeholder="Bild 1">
<input id="i2" placeholder="Bild 2">
<button onclick="addPerson()">Hinzufügen</button>

<hr>
<button onclick="favMode^=1;draw()">⭐ Favoriten Modus</button>
</div>

<button onclick="hide^=1;draw()">Bilder</button>
<button onclick="alt^=1;draw()">Wechsel</button>

</div>

<input id="s" placeholder="Suchen...">
<div id="t"></div>

<!-- context menu -->
<div id="ctx">
<button onclick="editItem()">Bearbeiten</button>
<button onclick="deleteItem()">Löschen</button>
<button onclick="toggleFav()">Favorisieren</button>
</div>

<script>

// Daten
d = [
["aaliyah yasin","https://mega.nz/...","https://i.imgur.com/blV0wEK.jpeg"],
["annywalker","https://mega.nz/...","https://i.imgur.com/KG9wrc2.jpeg"]
];

// Speicher
extra = JSON.parse(localStorage.extra||"[]");
k = JSON.parse(localStorage.k||"{}");
fav = JSON.parse(localStorage.fav||"{}");

extra.forEach(v=>d.push([v.name,v.link,v.img1]));

hide=0; alt=0; favMode=0;

function save(){
localStorage.extra=JSON.stringify(extra);
localStorage.k=JSON.stringify(k);
localStorage.fav=JSON.stringify(fav);
}

// Add
function addPerson(){
let name=n1.value.trim();
let link=l1.value.trim();
let img1=i1.value.trim();
let img2=i2.value.trim();

if(!name||!link||!img1)return;

d.push([name,link,img1]);
extra.push({name,link,img1,img2});
save();
draw();
}

// Klick
function go(name,url){
k[name]=(k[name]||0)+1;
save();
draw();
window.open(url);
}

// Draw
function draw(){
t.innerHTML="";

let list=[...d].filter(v=>
v[0].toLowerCase().includes(s.value.toLowerCase())
);

list.sort((a,b)=>{
let fa=fav[a[0]]?1:0;
let fb=fav[b[0]]?1:0;

if(favMode){
if(fa!==fb) return fb-fa;
}else{
if(fa!==fb) return fb-fa;
}

return (k[b[0]]||0)-(k[a[0]]||0);
});

list.forEach(v=>{
if(favMode && !fav[v[0]]) return;

let name=v[0];
let url=v[1];
let img=v[2];

t.innerHTML+=`
<div class="r" 
oncontextmenu="openCtx(event,'${name}')"
ontouchstart="hold(event,'${name}')">

<div class="l">
<div class="n">${name}</div>
<button class="go" onclick="go('${name}','${url}')">▶</button>
<div class="c">${k[name]||0}</div>
</div>

${hide?"":`<img src="${img}">`}

${fav[name]?'<div class="heart">❤️</div>':""}

</div>`;
});
}

// Context Menü
let current=null;

function openCtx(e,name){
e.preventDefault();
current=name;
ctx.style.display="block";
ctx.style.left=e.pageX+"px";
ctx.style.top=e.pageY+"px";
}

// Long press mobile
let timer;
function hold(e,name){
timer=setTimeout(()=>{
openCtx(e.touches[0],name);
},500);
}
document.body.ontouchend=()=>clearTimeout(timer);

// Aktionen
function deleteItem(){
d=d.filter(x=>x[0]!=current);
extra=extra.filter(x=>x.name!=current);
delete fav[current];
delete k[current];
save();
ctx.style.display="none";
draw();
}

function editItem(){
let item=d.find(x=>x[0]==current);
let newLink=prompt("Neuer Link",item[1]);
if(newLink){
item[1]=newLink;
save();
draw();
}
ctx.style.display="none";
}

function toggleFav(){
fav[current]=!fav[current];
save();
ctx.style.display="none";
draw();
}

// close ctx
document.onclick=()=>ctx.style.display="none";

s.oninput=draw;
draw();

</script>

</body>
</html>
